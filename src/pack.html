<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Viaje</title>
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="style/pack.css">
    
    <!-- Scripts -->
    <script src="script/usuario.js" defer></script>
    <script src="script/packs.js" defer></script>
    <script src="script/favorites.js"></script>
    <script src="script/experiencias.js" defer></script>
    <script src="script/pag_packs.js" defer></script>
    <link rel="icon" type="image/png" href="images/luna.png">
</head>

<body>

    <header>

        <!-- Sección izquierda: logo -->
            <div class="logo-section">
            <img src="images/logo.png" alt="Logo de Moonloop" class="logo">
            </div>

            <!-- Sección central: índice -->
            <nav class="nav-menu">
            <ul>
            <li><a id="nav_home" href="home.html">Inicio</a></li>
            <li><a id="nav_user" href="#usuario">Usuario</a></li>
            <li><a id="nav_destinations" href="destinos.html">Destinos</a></li>
            <li><a id="nav_otherplaces" href="otros_rincones.html">Otros rincones</a></li>
            <li><a id="nav_community" href="comunidad.html">Comunidad</a></li>
            </ul>
            </nav>
        <!-- Sección derecha: idiomas -->
            <div class="language-section">
            <select name="language" id="language-select">
                <option value="es">ES</option>
                <option value="en">EN</option>
            </select>
            </div>
    </header>

        <!-- Breadcrumb -->
    <nav id="breadcrumb" class="breadcrumb">
        <!-- JS generará los enlaces aquí -->
    </nav>


    <!-- Usamos el ID que tu JS espera -->
    <main id="pack-container">
        
        <!-- CABECERA DE TEXTO (Nombre, Precio, Destinos) -->
        <div class="pack-header">
            <h1 id="pack-nombre">Cargando...</h1>
            <div class="meta-data">
                <span id="pack-pais" class="meta-tag"></span>
                <span id="pack-destinos" class="meta-tag"></span>
                <span id="pack-duracion" class="meta-tag"></span> 
                <span id="pack-precio" class="meta-price"></span>
            </div>
        </div>

        <!-- ESTRUCTURA PRINCIPAL (Grid: Foto Izquierda - Texto Derecha) -->
        <section class="pack-main-grid">
            
            <!-- Columna 1: Imagen -->
            <div class="image-wrapper">
                <img id="pack-imagen" src="" alt="Imagen del viaje">
            </div>

            <!-- Columna 2: Descripción y Botón -->
            <div class="info-wrapper">
                <h2>La Experiencia</h2>
                <p id="pack-descripcion"></p>

                <div class="includes-box">
                    <h3>¿Qué incluye?</h3>
                    <ul id="pack-incluye"></ul>
                </div>

                <!-- Botón colocado manualmente donde queda bien -->
                <a id="btn-comprar" class="boton-comprar-manual">Comprar ya</a>

                <!--Añadir a favoritos-->
                <button id="btn-fav" class="btn-fav not-favorite">
                <span class="heart">♥</span>
                <span class="fav-text">Añadir a favoritos</span>
                </button>

            </div>

        </section>

        <!-- ITINERARIO (Fondo Beige) -->
        <section class="itinerary-section">
            <h2>Itinerario de viaje</h2>
            <!-- Tu JS llenará esto con divs clase "it-item" -->
            <div id="pack-itinerario"></div>
        </section>

        <section id="exp-rel-section" >
            <h2>Experiencias de viajeros</h2>

            <div class="exp-rel-layout">

                <!-- ⬅Columna de experiencias -->
                <div id="exp-rel-grid" class="exp-col"></div>

                <!-- Columna galería de fotos -->
                <div id="exp-gallery" class="gallery-col"></div>

            </div>
        </section>

    </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-left">
            <img src="images/logo.png" alt="Moonloop logo" class="footer-logo">
            <p>Contacto +34 666 722 227</p>
            <a href="#" data-i18n="footer_policies">Políticas</a>
            <a href="#" data-i18n="footer_faqs">FAQs</a>
        </div>

        <div class="footer-newsletter">
            <label for="email-input" data-i18n="newsletter_title">¡No te pierdas nada con nuestra Newsletter!</label>
            <div class="newsletter-box">
                <input type="email" id="email-input" placeholder="Introduce tu correo" data-i18n-placeholder="newsletter_placeholder">
                <button id="subscribe-btn" data-i18n="newsletter_button">Enviar</button>
            </div>
            <p class="newsletter-msg"></p>
        </div>

        <div class="footer-icons">
            <a href="#"><img src="images/ig.webp" alt="Instagram"></a>
            <a href="#"><img src="images/whatsapp.webp" alt="LinkedIn"></a>
            <a href="#"><img src="images/x.png" alt="X"></a>
        </div>

    </footer>

</body>
</html>
