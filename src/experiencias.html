<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiencia Moonloop</title>
    
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="style/experiencia.css">
    
    <!-- Scripts de datos y lógica -->
    <script src="script/usuario.js" defer></script>
    <script src="script/packs.js" defer></script>
    <script src="script/experiencias.js" defer></script>
    <script src="script/pag_experiencia.js" defer></script>
    
    <link rel="icon" type="image/png" href="images/luna.png">
</head>
<body>

     <!-- HEADER -->
        <header>

            <!-- Sección izquierda: logo -->
             <div class="logo-section">
                <img src="images/logo.png" alt="Logo de Moonloop" class="logo">
             </div>

             <!-- Sección central: índice -->
              <nav class="nav-menu">
                <ul>
                <li><a data-i18n="nav_home" href="home.html">Inicio</a></li>
                <li><a id="nav_user" data-i18n="nav_user" href="#usuario">Usuario</a></li>
                <li><a data-i18n="nav_destinations" href="destinos.html">Destinos</a></li>
                <li><a data-i18n="nav_otherplaces" href="otros_rincones.html">Otros rincones</a></li>
                <li><a data-i18n="nav_community" href="comunidad.html">Comunidad</a></li>
                </ul>
              </nav>
            <!-- Sección derecha: idiomas -->
             <div class="language-section">
                <select name="language" id="language-select">
                    <option value="es">ES</option>
                    <option value="en">EN</option>
                </select>
             </div>
        </header>
    <!-- Breadcrumb simple -->
    <nav class="breadcrumbs-hero">
        <a href="comunidad.html">Comunidad</a>
        <span class="separator">›</span>
        <span class="actual">Experiencia</span>
    </nav>

    <!-- Aquí NO cambias nada: solo asegúrate de usar estos ids -->
    <main class="article-container">
        
        <!-- CABECERA DEL ARTÍCULO -->
        <header class="article-header">
            <h1 id="exp-titulo"></h1>

            <p id="exp-subtitulo" class="subtitle"></p>

            <div class="article-meta">
                <span id="exp-autor"></span>
                <span id="exp-fecha"></span>
            </div>
        </header>


        <!-- CONTENIDO PRINCIPAL -->
        <article class="article-body">
            
            <!-- Imagen Principal (Hero) -->
            <img id="exp-img1" class="img-fluid hero-img" src="" alt="">

            <p id="exp-p1" class="text-block first-letter"></p>
            <p id="exp-p2" class="text-block"></p>

            <!-- Segunda Imagen -->
            <figure>
                <img id="exp-img2" class="img-fluid" src="" alt="">
            </figure>

            <p id="exp-p3" class="text-block"></p>

            <!-- Tercera Imagen -->
            <figure>
                <img id="exp-img3" class="img-fluid" src="" alt="">
            </figure>

            <p id="exp-p4" class="text-block"></p>

        </article>

        <!-- SECCIÓN: VIAJE RELACIONADO (Call to Action) -->
        <section id="related-pack-section" class="related-pack-box" style="display:none;">
            <h3>¿Te gustaría vivir esto?</h3>
            <div class="related-card">
                <img id="rel-img" src="" alt="">
                <div class="rel-info">
                    <span class="tag">Pack Recomendado</span>
                    <h4 id="rel-nombre"></h4>
                    <p id="rel-desc"></p>
                    <div class="rel-bottom">
                        <span id="rel-precio" class="price"></span>
                        <a id="rel-link" href="#" class="btn-ver">Ver Itinerario Completo</a>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">

        <div class="footer-left">
            <img src="images/logo.png" alt="Moonloop logo" class="footer-logo">
            <p>Contacto +34 666 722 227</p>
            <a href="#" data-i18n="footer_policies">Políticas</a>
            <a href="#" data-i18n="footer_faqs">FAQs</a>
        </div>

        <div class="footer-newsletter">
            <label for="email-input" data-i18n="newsletter_title">¡No te pierdas nada con nuestra Newsletter!</label>
            <div class="newsletter-box">
                <input type="email" id="email-input" placeholder="Introduce tu correo" data-i18n-placeholder="newsletter_placeholder">
                <button id="subscribe-btn" data-i18n="newsletter_button">Enviar</button>
            </div>
            <p class="newsletter-msg"></p>
        </div>

        <div class="footer-icons">
            <a href="#"><img src="images/ig.webp" alt="Instagram"></a>
            <a href="#"><img src="images/whatsapp.webp" alt="LinkedIn"></a>
            <a href="#"><img src="images/x.png" alt="X"></a>
        </div>

    </footer>


</body>
</html>
