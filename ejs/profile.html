<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Usuario | Moonloop</title>
    <link rel="stylesheet" href="../styles/usuario.css">
    <script src="../js/usuario.js" defer></script>
    <script src="../js/main.js" defer></script>

</head>

<body>
    <!-- HEADER -->
        <header>
            <!-- Sección izquierda: logo -->
             <div class="logo-section">
                <img src="../images/logo.png" alt="Logo de Moonloop" class="logo">
             </div>

             <!-- Sección central: índice -->
              <nav class="nav-menu">
                <ul>
                <li><a data-i18n="nav_home" href="home.html">Inicio</a></li>
                <li><a id="nav_user" href="#">Usuario</a></li>
                <li><a data-i18n="nav_destinations" href="destinos.html">Destinos</a></li>
                <li><a data-i18n="nav_otherplaces" href="#otrosrincones">Otros rincones</a></li>
                <li><a data-i18n="nav_community" href="comunidad.html">Comunidad</a></li>
                </ul>
              </nav>
            <!-- Sección derecha: idiomas -->
             <div class="language-section">
                <select name="language" id="language-select">
                    <option value="es">ES</option>
                    <option value="en">EN</option>
                </select>
             </div>
        </header>
<!-- MAIN CONTENT -->
 <main class="profile">

    <!-- SALUDO -->
    <section class="profile-header">
        <h1>Hola, <span id="profile-name"></span></h1>
        <p>Bienvenido/a de nuevo a tu espacio Moonloop.</p>
    </section>


    <!-- FAVORITOS -->
    <section class="profile-section">
        <h2>Mis favoritos</h2>
        <div id="favorites-container" class="profile-cards">
            <!-- Se insertan aquí con JS -->
        </div>
    </section>

    <hr>

    <!-- COMPRAS -->
    <section class="profile-section">
        <h2>Mis compras</h2>
        <div id="purchases-container" class="profile-cards">
            <!-- Se insertan aquí con JS -->
        </div>
    </section>


    <!-- CONFIGURACIÓN -->
    <section class="profile-section config">
        <a href="#" class="config-link">Configuración</a>
    </section>

    <hr>

    <!-- CERRAR SESIÓN -->
    <section class="logout">
        <button id="logout-btn">Cerrar sesión</button>
    </section>

    <!-- MODAL DE CONFIRMACIÓN DE LOGOUT -->
    <div id="logout-modal" class="modal hidden">
        <div class="modal-content">
            <h2>¿Estás seguro?</h2>
            <p>¿Deseas cerrar sesión?</p>

            <div class="modal-buttons">
                <button id="confirm-logout" class="btn-primary">Sí, cerrar sesión</button>
                <button id="cancel-logout" class="btn-secondary">Cancelar</button>
            </div>
        </div>
    </div>

</main>
