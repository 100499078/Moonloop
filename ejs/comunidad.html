<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Comunidad</title>
        <link rel="stylesheet" href="../styles/comunidad.css">
        <link rel="stylesheet" href="../styles/main.css">
        <link rel="icon" type="image/png" href="../images/luna.png">
    </head>

    <body>  
        <header>

                <!-- Sección izquierda: logo -->
                <div class="logo-section">
                    <img src="../images/logo.png" alt="Logo de Moonloop" class="logo">
                </div>

                <!-- Sección central: índice -->
                <nav class="nav-menu">
                    <ul>
                    <li><a id="nav_home" href="home.html">Inicio</a></li>
                    <li><a id="nav_user" href="#usuario">Usuario</a></li>
                    <li><a id="nav_destinations" href="destinos.html">Destinos</a></li>
                    <li><a id="nav_otherplaces" href="otros_rincones.html">Otros rincones</a></li>
                    <li><a id="nav_community" href="comunidad.html">Comunidad</a></li>
                    </ul>
                </nav>
                <!-- Sección derecha: idiomas -->
                <div class="language-section">
                    <select name="language" id="language-select">
                        <option value="es">ES</option>
                        <option value="en">EN</option>
                    </select>
                </div>
        </header>

        <main>
        <section class="comunidad-main">

            <div class="comunidad-subheader">
            <h1>Comunidad</h1>

            <div class="comunidad-tabs">
                <button class="tab-btn active" data-tab="experiencias">Experiencias</button>
                <button class="tab-btn" data-tab="foro">Foro / Consejos</button>
            </div>
            </div>

            <div class="comunidad-layout">
            <!-- EXPERIENCIAS -->

            <div class="comunidad-lista" id="tab-experiencias">
                <div class="comunidad-filtros-superior">
                    <label for="filtro-pais">Filtrar:</label>
                    <select id="filtro-pais">
                        <option value="todos">Todos los países</option>
                        <option value="colombia">Colombia</option>
                        <option value="japon">Japón</option>
                        <option value="islandia">Islandia</option>
                        <option value="kenia">Kenia</option>
                        <option value="peru">Perú</option>
                        <option value="vietnam">Vietnam</option>
                        <option value="panama">Panamá</option>
                        <option value="turquia">Turquía</option>
                        <option value="filipinas">Filipinas</option>
                    </select>
                </div>

                <!-- AQUÍ meteremos las cards desde JS -->
                <div id="lista-experiencias" class="cards-grid"></div>
            </div>


            <!-- FORO / CONSEJOS -->
            <div class="comunidad-lista hidden" id="tab-foro">
                <div id="lista-consejos" class="cards-grid"></div>
            </div>

            <!-- SIDEBAR -->
            <aside class="comunidad-sidebar">
                <div class="search-box">
                <label for="buscador-comunidad">Buscar</label>
                <input type="text" id="buscador-comunidad" placeholder="Experiencias, país...">
                </div>

                <div class="sidebar-filtros">
                    <h4>Ordenar por</h4>

                    <div class="orden-opcion">
                        <input type="radio" name="orden" id="orden-recientes" value="recientes" checked>
                        <label for="orden-recientes">Más recientes</label>
                    </div>

                    <div class="orden-opcion">
                        <input type="radio" name="orden" id="orden-likes" value="likes">
                        <label for="orden-likes">Más likes</label>
                    </div>
                    </div>
            </aside>
            </div>
        </section>
        </main>
        <footer class="footer">
        
            <div class="footer-left">
                <img src="../images/logo.png" alt="Moonloop logo" class="footer-logo">
                <p>Contacto +34 666 722 227</p>
                <a href="#" data-i18n="footer_policies">Políticas</a>
                <a href="#" data-i18n="footer_faqs">FAQs</a>
            </div>

            <div class="footer-newsletter">
                <label for="email-input" data-i18n="newsletter_title">¡No te pierdas nada con nuestra Newsletter!</label>
                <div class="newsletter-box">
                    <input type="email" id="email-input" placeholder="Introduce tu correo" data-i18n-placeholder="newsletter_placeholder">
                    <button id="subscribe-btn" data-i18n="newsletter_button">Enviar</button>
                </div>
                <p class="newsletter-msg"></p>
            </div>

            <div class="footer-icons">
                <a href="#"><img src="../images/ig.webp" alt="Instagram"></a>
                <a href="#"><img src="../images/whatsapp.webp" alt="LinkedIn"></a>
                <a href="#"><img src="../images/x.png" alt="X"></a>
            </div>

        </footer>
        <script src="../js/experiencias.js" defer></script>
        <script src="../js/consejos.js" defer></script>
        <script src="../js/comunidad.js" defer></script>
        <script src="../js/main.js" defer></script>
        <script src="../js/usuario.js" defer></script>

        
    </body>
</html>
