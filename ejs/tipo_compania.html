<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipo de Compañía</title>
    <link rel="stylesheet" href="../styles/tipo_compania.css">
    <link rel="stylesheet" href="../styles/main.css">
    <script src="../js/packs.js" defer></script>
    <script src="../js/usuario.js" defer></script>
    <script src="../js/favorites.js" defer></script>
    <script src="../js/tipo_compania.js" defer></script>
</head>
<body>

<header>
    <div class="logo-section">
        <img src="../images/logo.png" alt="Logo de Moonloop" class="logo">
    </div>

    <nav class="nav-menu">
        <ul>
            <li><a id="nav_home" href="home.html">Inicio</a></li>
            <li><a id="nav_user" href="#usuario">Usuario</a></li>
            <li><a id="nav_destinations" href="destinos.html">Destinos</a></li>
            <li><a id="nav_otherplaces" href="otros_rincones.html">Otros rincones</a></li>
            <li><a id="nav_community" href="comunidad.html">Comunidad</a></li>
        </ul>
    </nav>

    <div class="language-section">
        <select name="language" id="language-select">
            <option value="es">ES</option>
            <option value="en">EN</option>
        </select>
    </div>
</header>

<main>
    <!-- Cabecera con imagen y título -->
    <section class="compania-header">
        <img id="compania-imagen" src="" alt="Imagen compañía">
        <h1 id="compania-titulo"></h1>
        <p id="compania-descripcion"></p>
    </section>

    <!-- Packs destacados -->
    <section class="compania-destacados">
        <h2>Packs destacados</h2>
        <div id="destacados-list" class="lista-destacados"></div>
    </section>

    <!-- Todos los packs -->
    <section class="compania-todos">
        <h2>Todos los packs</h2>
        <div id="todos-list" class="grid-packs"></div>
    </section>
    
    <!-- Otros tipos de compañía -->
    <section class="otras-companias">
        <h2>Descubre otros tipos de viaje</h2>
        <div id="otras-companias-list" class="grid-compania"></div>
    </section>
</main>

</body>
</html>
