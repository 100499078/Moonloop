<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Usuario | Moonloop</title>
    <link rel="stylesheet" href="../styles/usuario.css">
    <script src="../js/usuario.js" defer></script>
    <script src="../js/main.js" defer></script>
</head>

<body>
<!-- HEADER -->
<header>
    <!-- Sección izquierda: logo -->
        <div class="logo-section">
        <img src="../images/logo.png" alt="Logo de Moonloop" class="logo">
        </div>

        <!-- Sección central: índice -->
        <nav class="nav-menu">
        <ul>
        <li><a data-i18n="nav_home" href="home.html">Inicio</a></li>
        <li><a id="nav_user" href=#>Usuario</a></li>
        <li><a data-i18n="nav_destinations" href="destinos.html">Destinos</a></li>
        <li><a data-i18n="nav_otherplaces" href="#otrosrincones">Otros rincones</a></li>
        <li><a data-i18n="nav_community" href="comunidad.html">Comunidad</a></li>
        </ul>
        </nav>
    <!-- Sección derecha: idiomas -->
        <div class="language-section">
        <select name="language" id="language-select">
            <option value="es">ES</option>
            <option value="en">EN</option>
        </select>
        </div>
</header>

<!-- MAIN CONTENT -->
<main class="register">

    <section class="register-left">
        <h1>¡Forma parte de nuestra familia viajera!</h1>

        <div class="register-box">
            <label>Nombre</label>
            <input type="text" id="register-name" placeholder="Tu nombre">

            <label>Apellidos</label>
            <input type="text" id="register-surname" placeholder="Tus apellidos">

            <label>Email</label>
            <input type="email" id="register-email" placeholder="example@mail.com">

            <label>Contraseña</label>
            <input type="password" id="register-password" placeholder="••••••••">

            <label>Repite la contraseña</label>
            <input type="password" id="register-password2" placeholder="••••••••">

            <button class="btn-primary" id="register-btn">Registrarse</button>
        </div>

        <button class="btn-secondary" onclick="window.location.href='acceso_user.html'">Volver</button>
    </section>

    <!-- FOTO A LA DERECHA -->
    <aside class="register-image">
        <img src="../images/user.png" alt="Imagen registro Moonloop">
    </aside>

</main>

<!-- FOOTER -->
<footer class="footer">

    <div class="footer-left">
        <img src="../images/logo.png" alt="Moonloop logo" class="footer-logo">
        <p>Contacto +34 666 722 227</p>
        <a href="#" data-i18n="footer_policies">Políticas</a>
        <a href="#" data-i18n="footer_faqs">FAQs</a>
    </div>

    <div class="footer-newsletter">
        <label for="email-input" data-i18n="newsletter_title">¡No te pierdas nada con nuestra Newsletter!</label>
        <div class="newsletter-box">
            <input type="email" id="email-input" placeholder="Introduce tu correo" data-i18n-placeholder="newsletter_placeholder">
            <button id="subscribe-btn" data-i18n="newsletter_button">Enviar</button>
        </div>
        <p class="newsletter-msg"></p>
    </div>

    <div class="footer-icons">
        <a href="#"><img src="../images/ig.webp" alt="Instagram"></a>
        <a href="#"><img src="../images/whatsapp.webp" alt="LinkedIn"></a>
        <a href="#"><img src="../images/x.png" alt="X"></a>
    </div>

</footer>

</body>
